# Theme taxonomies (generated by `pulse themes`; the database is the source of truth)
versions:
- version: v1
  created_at: '2026-10-17T10:04:25+00:00'
  approved: true
  themes:
  - id: ease_of_use_praise
    name: Ease of Use Praise
    definition: Positive reviews whose main point is general praise for Groww's simplicity, clean interface,
      beginner-friendliness, smoothness or trustworthiness, with no specific complaint or request.
    includes:
    - simple, clean, user-friendly interface
    - good for beginners and first-time investors
    - smooth, fast and reliable experience
    - trust and long-time satisfaction
    - easy SIP, mutual fund and stock investing
    excludes:
    - positive reviews whose main point is a feature request or a removed feature (feature_requests_ui_changes)
    - positive reviews that mainly complain about brokerage or charges (charges_pricing)
    - positive reviews mainly reporting lag or glitches (app_reliability_execution)
  - id: app_reliability_execution
    name: App Reliability & Execution
    definition: 'Technical failures in the app or trading engine: lag, crashes, freezes, login or app-open
      errors, charts and prices not loading or updating, and orders, stop-losses or positions behaving
      incorrectly.'
    includes:
    - lag, hanging, crashes and slowness, especially at market open or expiry
    - app not opening, login errors, stuck on permissions screen, 'no healthy upstream'
    - charts, prices, option chain or P&L not loading or not updating
    - order execution delays, rejections or stuck orders
    - stop-loss or target slippage and wrong trigger prices
    - positions, holdings or average price shown wrongly or missing
    excludes:
    - complaints about new layouts, the scalper button, hidden back buttons or removed features after
      an update (feature_requests_ui_changes)
    - withdrawals, deposits or KYC stuck (support_funds_accounts)
    - losses blamed on brokerage or charges (charges_pricing)
  - id: charges_pricing
    name: Brokerage & Charges
    definition: 'Complaints or requests about the cost of using Groww: brokerage, DP and other fees, hidden
      or unclear deductions, MTF interest and plan pricing.'
    includes:
    - high ₹20 per order brokerage versus ₹10 or zero at competitors
    - DP, DDPI, square-off, edit and other fees
    - hidden or unclear charges eating profits
    - MTF interest, haircut and pledge costs
    - MF Prime or regular plans and higher expense ratios
    - requests for subscription or low-cost plans
    excludes:
    - wrong execution prices or slippage causing losses (app_reliability_execution)
    - refunds or money not credited (support_funds_accounts)
  - id: support_funds_accounts
    name: Support, Funds & Accounts
    definition: 'Customer service and back-office problems: unreachable or unhelpful support, and delays
      or failures in withdrawals, deposits, KYC, onboarding, account changes or closure, and MF, SIP or
      IPO processing.'
    includes:
    - long call or chat waits, AI bot replies, tickets closed unresolved
    - withdrawal delays, failed payouts, funds blocked or missing
    - add-money, UPI or IPO mandate failures
    - KYC pending, account activation, re-KYC, name or email changes
    - demat closure and stock transfer difficulty
    - MF or SIP orders, redemptions, dividends or units not processed
    excludes:
    - app crashes or login errors not tied to account status (app_reliability_execution)
    - complaints about fee amounts (charges_pricing)
    - requests for new investment features such as SWP or US stocks (feature_requests_ui_changes)
  - id: feature_requests_ui_changes
    name: Features & UI Changes
    definition: Requests for new or restored features and complaints about product design and update-driven
      layout changes, as opposed to outright malfunctions.
    includes:
    - 'chart tools: indicators, multi-chart, saved drawings, SL/TP on chart, trailing SL'
    - 'investing features: SWP/STP, daily SIP, US stocks, family portfolio, MF analytics'
    - 'removed features: scalper mode, GR-1 AI, recently viewed, VWAP, old layouts'
    - 'post-update layout complaints: scalper button, hidden back or navigation bar, F&O landing page'
    - tablet/iPad support, font size, dark theme, language
    - too frequent update prompts, promotional loan or F&O nudges
    excludes:
    - lag, crashes or data not loading after an update (app_reliability_execution)
    - requests to lower brokerage or fees (charges_pricing)
    - account switching, family-add or KYC flows that fail to work (support_funds_accounts)
